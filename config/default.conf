# Auslieferung: statische Dateien (eine Seite) hinter nginx.
#
# - Die Anwendung ist eine einzige index.html; alle übrigen Wege zeigen darauf.
# - Startseite und das Verzeichnis der Wellenformen dürfen NICHT
#   zwischengespeichert werden, sonst bleibt nach einer neuen Fassung die alte
#   liegen.
# - Kreuzherkunft-Isolation (COOP/COEP) setzen wir wie beim Vorbild: das
#   Werkzeug arbeitet mit einer Klangmaschine (Tone.js) und ist damit für
#   gemeinsamen Speicher gerüstet. Schaden kann es nicht — es gibt keine
#   fremden Bestandteile, die daran scheitern könnten.
# - Content-Security-Policy verbietet Fremdaufrufe. Sie erlaubt genau das, was
#   das Werkzeug braucht: eigene Dateien, Blob- und Daten-Adressen (Worker für
#   die Klangerzeugung) — und sonst nichts. connect-src 'self' heisst: kein
#   Server ausser unserem eigenen.
# - ACHTUNG, nginx-Falle: eine eigene add_header-Zeile in einem location-Block
#   SCHALTET die geerbten add_header-Zeilen ab. Deshalb hier kein add_header in
#   den locations — sonst fällt die CSP genau auf der Startseite weg.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml text/javascript;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' blob: data:; font-src 'self' data:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /gesundheit {
        return 200 "ok\n";
    }

    # Startseite und Verzeichnis der Wellenformen: immer beim Server fragen.
    location = /index.html {
        expires -1;
    }

    location = /waveforms/index.json {
        expires -1;
    }

    # Gehashte Bündel-Dateien: ein Jahr zwischenspeichern ist unbedenklich.
    location ~* ^/assets/ {
        expires 1y;
    }

    # Klänge und Wellenformen: unveränderliche Namen, lange zwischenspeichern.
    # (Kein {n}-Zähler im Muster: nginx verlangt dafür ein Anführungszeichen um
    #  den ganzen Ausdruck. Einfacher ist ein Muster ohne Zähler.)
    location ~* ^/samples/ {
        expires 30d;
    }

    location ~* ^/waveforms/ {
        expires 30d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
